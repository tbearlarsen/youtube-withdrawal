{# Grouped-by-category sections, every video shown. Expects sections (with anchor). #}
{% for section in sections %}
<section id="{{ section.anchor }}" class="mb-10" style="scroll-margin-top:7rem">
    <div class="mb-4" style="border-bottom:1px solid var(--c-border);padding-bottom:0.5rem">
        <h2 style="font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;color:var(--c-text2);font-family:system-ui,sans-serif">
            {{ section.label }}
            <span style="margin-left:0.4rem;color:var(--c-text4);font-weight:400">{{ section.count }}</span>
        </h2>
    </div>
    {% set grid_videos = section.videos %}
    {% include "partials/video_grid.html" %}
</section>
{% endfor %}
